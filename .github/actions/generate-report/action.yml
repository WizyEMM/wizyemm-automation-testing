name: 'Generate and Compress Report'
description: 'Generate Allure report and compress results for Slack reporter'

inputs:
  instance:
    description: 'V3: instance/environment name (used in the artifact name so parallel runs stay distinct)'
    required: false
    default: ''
  instance_type:
    description: 'Legacy (v2): instance type — used for the artifact name when instance is not provided'
    required: false
    default: ''
  environment:
    description: 'Legacy (v2): environment — used for the artifact name when instance is not provided'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Generate Allure Report
      run: |
        npm install -g allure
        allure generate allure-results -o allure-report || true
      shell: bash

    - name: Compress Allure Results for Slack Reporter
      run: |
        if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
          tar -czf allure-results.tar.gz allure-results/
          SIZE=$(du -h allure-results.tar.gz | cut -f1)
          echo "✅ Compressed allure-results ($SIZE)"
          [ -f "allure-results.tar.gz" ] && echo "✓ Archive file verified" || exit 1
        else
          echo "⚠️ No allure-results to compress"
          touch allure-results.tar.gz
        fi
      shell: bash

    - name: Upload Allure Results as Artifact (Slack Reporter)
      uses: actions/upload-artifact@v4
      with:
        # V3 passes `instance`; legacy v2 passes instance_type + environment.
        name: allure-results-${{ inputs.instance != '' && inputs.instance || format('{0}-{1}', inputs.instance_type, inputs.environment) }}-${{ github.run_id }}
        path: allure-results.tar.gz
        retention-days: 1

