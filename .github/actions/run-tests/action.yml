name: 'Run Playwright Tests'
description: 'Fetch app version and run login and/or full Playwright suites for one resolved instance/environment'

inputs:
  test_scope:
    description: 'Login Tests Only | All Tests | Login + All Tests'
    required: true
  login_config:
    description: 'Playwright login config path'
    required: true
  test_env:
    description: 'Value for TEST_ENV (jamf for JAMF instance, empty otherwise)'
    required: false
    default: ''
  domain:
    description: 'Resolved DOMAIN secret'
    required: true
  email:
    description: 'Resolved EMAIL secret'
    required: true
  namespace:
    description: 'Resolved NAMESPACE secret'
    required: true
  password:
    description: 'Resolved PASSWORD secret'
    required: true
  region:
    description: 'Resolved REGION secret'
    required: true

outputs:
  version:
    description: 'App version fetched from the public version API'
    value: ${{ steps.version.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Validate resolved secrets
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        DOMAIN: ${{ inputs.domain }}
      run: |
        if [ -z "$NAMESPACE" ] || [ "$NAMESPACE" = "false" ] || [ -z "$DOMAIN" ] || [ "$DOMAIN" = "false" ]; then
          echo "❌ Resolved NAMESPACE/DOMAIN is empty."
          echo "   The selected instance/environment has no secrets configured in GitHub."
          echo "   (Prod-EU requires JAMF_PROD_EU_* secrets to be added first.)"
          exit 1
        fi
        echo "✅ Resolved secrets present"

    - name: Fetch Current Version from API
      id: version
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        REGION: ${{ inputs.region }}
        DOMAIN: ${{ inputs.domain }}
      run: |
        FULL_URL="https://${NAMESPACE}.${REGION}.${DOMAIN}/api/v1/public/version"
        echo "📡 Fetching version from: $FULL_URL"
        RESPONSE=$(curl -s --max-time 10 "$FULL_URL" || true)
        echo "📦 API Response: $RESPONSE"

        VERSION=$(echo "$RESPONSE" | jq -r '.version // ""' 2>/dev/null || echo "")

        if [ -z "$VERSION" ]; then
          echo "⚠️ Failed to fetch version from API, will proceed without version"
          echo "version=" >> $GITHUB_OUTPUT
        else
          echo "✅ Successfully fetched version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi

    - name: Run login tests
      if: inputs.test_scope == 'Login Tests Only' || inputs.test_scope == 'Login + All Tests'
      shell: bash
      env:
        DOMAIN: ${{ inputs.domain }}
        EMAIL: ${{ inputs.email }}
        NAMESPACE: ${{ inputs.namespace }}
        PASSWORD: ${{ inputs.password }}
        REGION: ${{ inputs.region }}
        TEST_ENV: ${{ inputs.test_env }}
      run: npx playwright test --config=${{ inputs.login_config }} --reporter=line,allure-playwright

    - name: Run all tests
      if: always() && (inputs.test_scope == 'All Tests' || inputs.test_scope == 'Login + All Tests')
      shell: bash
      env:
        DOMAIN: ${{ inputs.domain }}
        EMAIL: ${{ inputs.email }}
        NAMESPACE: ${{ inputs.namespace }}
        PASSWORD: ${{ inputs.password }}
        REGION: ${{ inputs.region }}
        TEST_ENV: ${{ inputs.test_env }}
      run: npx playwright test tests/profile tests/application tests/configuration tests/dashboard tests/fleet tests/notifications tests/settings --config=playwright.config.ts --project=firefox --reporter=line,allure-playwright
