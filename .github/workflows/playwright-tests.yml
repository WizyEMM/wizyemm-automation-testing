  login-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Clean previous results
        run: |
          rm -rf allure-results test-results
          mkdir -p allure-results test-results

      - name: Run login tests
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          EMAIL: ${{ secrets.EMAIL }}
          NAMESPACE: ${{ secrets.NAMESPACE }}
          PASSWORD: ${{ secrets.PASSWORD }}
          REGION: ${{ secrets.REGION }}
        run: npx playwright test --config=playwright.login.config.ts --reporter=line,allure-playwright

      - name: Upload allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-login
          path: allure-results/
          retention-days: 7

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report

      - name: Send Test Report to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RELEASE_TITLE: ${{ github.event.inputs.release_title }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          npm install node-fetch
          node scripts/slack-reporter.js
