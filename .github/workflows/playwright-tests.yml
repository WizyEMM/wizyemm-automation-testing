  login-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Clean previous results
        run: |
          rm -rf allure-results test-results
          mkdir -p allure-results test-results

      - name: Fetch Current Version from API
        id: version
        env:
          NAMESPACE: ${{ secrets.NAMESPACE }}
          REGION: ${{ secrets.REGION }}
          DOMAIN: ${{ secrets.DOMAIN }}
        continue-on-error: true
        run: |
          FULL_URL="https://${NAMESPACE}.${REGION}.${DOMAIN}/api/v1/public/version"
          echo "📡 Fetching version from: $FULL_URL"
          RESPONSE=$(curl -s --max-time 10 "$FULL_URL")
          echo "📦 API Response: $RESPONSE"
          
          VERSION=$(echo "$RESPONSE" | jq -r '.version // ""' 2>/dev/null || echo "")
          
          if [ -z "$VERSION" ]; then
            echo "⚠️ Failed to fetch version from API, will proceed without version"
            echo "version=" >> $GITHUB_OUTPUT
          else
            echo "✅ Successfully fetched version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Run login tests
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          EMAIL: ${{ secrets.EMAIL }}
          NAMESPACE: ${{ secrets.NAMESPACE }}
          PASSWORD: ${{ secrets.PASSWORD }}
          REGION: ${{ secrets.REGION }}
        run: npx playwright test --config=playwright.login.config.ts --reporter=line,allure-playwright

      - name: Upload allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-login
          path: allure-results/
          retention-days: 7

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload Allure Report to GCS
        if: always()
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          REPORT_PATH="allure-reports/latest"
          
          echo "📤 Uploading Allure report to GCS..."
          gsutil -m -h "Cache-Control:no-cache" cp -r allure-report/* gs://emm-test-artifacts/$REPORT_PATH/
          
          echo "✅ Report uploaded successfully"
          echo "📋 Report URL: https://storage.googleapis.com/emm-test-artifacts/$REPORT_PATH/index.html" >> $GITHUB_STEP_SUMMARY
          
          # Export for use in Slack reporter
          echo "ALLURE_REPORT_URL=https://storage.googleapis.com/emm-test-artifacts/$REPORT_PATH/index.html" >> $GITHUB_ENV

      - name: Send Test Report to Slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RELEASE_TITLE: ${{ steps.version.outputs.version || github.event.inputs.release_title }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          ALLURE_REPORT_URL: ${{ env.ALLURE_REPORT_URL }}
        run: |
          npm install node-fetch
          node scripts/slack-reporter.js
