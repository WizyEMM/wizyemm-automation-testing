name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release title from Jira'
        required: false
        type: string
      environment:
        description: 'Select environment to test'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging


jobs:
  automation-test:
    # Run on manual dispatch to staging
    if: github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed_url: ${{ steps.gcs_upload.outputs.signed_url }}
      report_version: ${{ steps.gcs_upload.outputs.report_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Clean previous results
        run: |
          rm -rf allure-results test-results
          mkdir -p allure-results test-results

      - name: Fetch Current Version from API
        id: version
        env:
          NAMESPACE: ${{ secrets.NAMESPACE }}
          REGION: ${{ secrets.REGION }}
          DOMAIN: ${{ secrets.DOMAIN }}
        continue-on-error: true
        run: |
          FULL_URL="https://${NAMESPACE}.${REGION}.${DOMAIN}/api/v1/public/version"
          echo "📡 Fetching version from: $FULL_URL"
          RESPONSE=$(curl -s --max-time 10 "$FULL_URL")
          echo "📦 API Response: $RESPONSE"
          
          VERSION=$(echo "$RESPONSE" | jq -r '.version // ""' 2>/dev/null || echo "")
          
          if [ -z "$VERSION" ]; then
            echo "⚠️ Failed to fetch version from API, will proceed without version"
            echo "version=" >> $GITHUB_OUTPUT
          else
            echo "✅ Successfully fetched version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Run login tests
        if: always()
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          EMAIL: ${{ secrets.EMAIL }}
          NAMESPACE: ${{ secrets.NAMESPACE }}
          PASSWORD: ${{ secrets.PASSWORD }}
          REGION: ${{ secrets.REGION }}
        run: npx playwright test --config=playwright.login.config.ts --reporter=line,allure-playwright

      - name: Run all tests
        if: always()
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          EMAIL: ${{ secrets.EMAIL }}
          NAMESPACE: ${{ secrets.NAMESPACE }}
          PASSWORD: ${{ secrets.PASSWORD }}
          REGION: ${{ secrets.REGION }}
        run: npx playwright test 
          tests/profile 
          tests/application 
          tests/configuration 
          tests/dashboard 
          tests/fleet 
          tests/notifications 
          tests/settings --config=playwright.config.ts --project=chromium --reporter=line,allure-playwright

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure
          allure generate allure-results -o allure-report || true

      - name: Authenticate to Google Cloud
        if: always()
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: always()
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload Allure Report to GCS (Direct)
        if: always()
        id: gcs_upload
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(date +%Y%m%d-%H%M%S)
          fi
          
          echo "📊 Checking existing test runs for version: $VERSION"
          
          FOLDER_LIST=$(gcloud storage ls "gs://emm-test-artifacts/allure-reports/" 2>/dev/null | grep "v${VERSION}-Tr\." || true)
          echo "Found folders: $FOLDER_LIST"
          
          if [ -z "$FOLDER_LIST" ]; then
            TEST_RUN=1
            echo "ℹ️ No existing runs found, starting with Tr.1"
          else
            HIGHEST=$(echo "$FOLDER_LIST" | sed 's/.*-Tr\.\([0-9]*\)\/.*/\1/' | sort -n | tail -1)
            TEST_RUN=$((HIGHEST + 1))
            echo "ℹ️ Found highest run number: $HIGHEST, next run will be: Tr.$TEST_RUN"
          fi
          
          REPORT_PATH="allure-reports/v${VERSION}-Tr.${TEST_RUN}"
          
          echo "📤 Uploading Allure report to GCS..."
          gcloud storage cp -r allure-report/* "gs://emm-test-artifacts/$REPORT_PATH/" || exit 1
          
          echo "✅ Report uploaded successfully"
          
          npm install @google-cloud/storage -q
          
          SIGNED_URL=$(node scripts/generate-signed-url.js "$GOOGLE_APPLICATION_CREDENTIALS" "emm-test-artifacts" "$REPORT_PATH/index.html" 7)
          
          if [ -z "$SIGNED_URL" ] || [[ ! "$SIGNED_URL" =~ ^https:// ]]; then
            echo "❌ Failed to generate signed URL"
            exit 1
          fi
          
          echo "✅ Signed URL generated successfully"
          echo "signed_url=$SIGNED_URL" >> $GITHUB_OUTPUT
          echo "report_version=v${VERSION}-Tr.${TEST_RUN}" >> $GITHUB_OUTPUT

  automation-test-prod:
    # Run on manual dispatch to production
    if: github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed_url: ${{ steps.gcs_upload.outputs.signed_url }}
      report_version: ${{ steps.gcs_upload.outputs.report_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Clean previous results
        run: |
          rm -rf allure-results test-results
          mkdir -p allure-results test-results

      - name: Fetch Current Version from API
        id: version
        env:
          NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
          REGION: ${{ secrets.PROD_REGION }}
          DOMAIN: ${{ secrets.PROD_DOMAIN }}
        continue-on-error: true
        run: |
          FULL_URL="https://${NAMESPACE}.${REGION}.${DOMAIN}/api/v1/public/version"
          echo "📡 Fetching version from: $FULL_URL"
          RESPONSE=$(curl -s --max-time 10 "$FULL_URL")
          echo "📦 API Response: $RESPONSE"
          
          VERSION=$(echo "$RESPONSE" | jq -r '.version // ""' 2>/dev/null || echo "")
          
          if [ -z "$VERSION" ]; then
            echo "⚠️ Failed to fetch version from API, will proceed without version"
            echo "version=" >> $GITHUB_OUTPUT
          else
            echo "✅ Successfully fetched version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Run login tests
        if: always()
        env:
          DOMAIN: ${{ secrets.PROD_DOMAIN }}
          EMAIL: ${{ secrets.PROD_EMAIL }}
          NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
          PASSWORD: ${{ secrets.PROD_PASSWORD }}
          REGION: ${{ secrets.PROD_REGION }}
        run: npx playwright test --config=playwright.login.config.ts --reporter=line,allure-playwright

      - name: Run all tests
        if: always()
        env:
          DOMAIN: ${{ secrets.PROD_DOMAIN }}
          EMAIL: ${{ secrets.PROD_EMAIL }}
          NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
          PASSWORD: ${{ secrets.PROD_PASSWORD }}
          REGION: ${{ secrets.PROD_REGION }}
        run: npx playwright test 
          tests/profile 
          tests/application 
          tests/configuration 
          tests/dashboard 
          tests/fleet 
          tests/notifications 
          tests/settings --config=playwright.config.ts --project=chromium --reporter=line,allure-playwright

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure
          allure generate allure-results -o allure-report || true

      - name: Authenticate to Google Cloud
        if: always()
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: always()
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload Allure Report to GCS (Direct)
        if: always()
        id: gcs_upload
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(date +%Y%m%d-%H%M%S)
          fi
          
          echo "📊 Checking existing test runs for version: $VERSION"
          
          FOLDER_LIST=$(gcloud storage ls "gs://emm-test-artifacts/allure-reports/" 2>/dev/null | grep "v${VERSION}-Tr\." || true)
          echo "Found folders: $FOLDER_LIST"
          
          if [ -z "$FOLDER_LIST" ]; then
            TEST_RUN=1
            echo "ℹ️ No existing runs found, starting with Tr.1"
          else
            HIGHEST=$(echo "$FOLDER_LIST" | sed 's/.*-Tr\.\([0-9]*\)\/.*/\1/' | sort -n | tail -1)
            TEST_RUN=$((HIGHEST + 1))
            echo "ℹ️ Found highest run number: $HIGHEST, next run will be: Tr.$TEST_RUN"
          fi
          
          REPORT_PATH="allure-reports/v${VERSION}-Tr.${TEST_RUN}"
          
          echo "📤 Uploading Allure report to GCS..."
          gcloud storage cp -r allure-report/* "gs://emm-test-artifacts/$REPORT_PATH/" || exit 1
          
          echo "✅ Report uploaded successfully"
          
          npm install @google-cloud/storage -q
          
          SIGNED_URL=$(node scripts/generate-signed-url.js "$GOOGLE_APPLICATION_CREDENTIALS" "emm-test-artifacts" "$REPORT_PATH/index.html" 7)
          
          if [ -z "$SIGNED_URL" ] || [[ ! "$SIGNED_URL" =~ ^https:// ]]; then
            echo "❌ Failed to generate signed URL"
            exit 1
          fi
          
          echo "✅ Signed URL generated successfully"
          echo "signed_url=$SIGNED_URL" >> $GITHUB_OUTPUT
          echo "report_version=v${VERSION}-Tr.${TEST_RUN}" >> $GITHUB_OUTPUT

  upload-report:
    # Send Slack notification with report URL from test job outputs
    if: always()
    needs: [automation-test, automation-test-prod]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send Test Report to Slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RELEASE_TITLE: ${{ github.event.inputs.release_title }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          ALLURE_REPORT_URL: ${{ needs.automation-test.outputs.signed_url || needs.automation-test-prod.outputs.signed_url }}
          ALLURE_VERSION: ${{ needs.automation-test.outputs.report_version || needs.automation-test-prod.outputs.report_version }}
        run: |
          echo "🔍 Environment variables check:"
          echo "  - ALLURE_REPORT_URL: ${ALLURE_REPORT_URL:0:50}..."
          echo "  - ALLURE_VERSION: $ALLURE_VERSION"
          echo "  - SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:0:20}..."
          
          npm install node-fetch
          node scripts/slack-reporter.js